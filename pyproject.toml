[project]
name = "jobhunter-chat"
version = "0.1.0"
description = "Internal read-only Odoo Jobhunter Chat AI service"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.8,<3", "sqlalchemy[asyncio]>=2.0.38,<3", "asyncpg>=0.30,<1", "openai>=2,<3", "httpx>=0.28,<1", "pypdf>=6,<7", "python-docx>=1.1,<2", "defusedxml>=0.7,<1", "python-dotenv>=1,<2", "python-multipart>=0.0.9,<1", "psycopg[binary]>=3.2,<4", "tzdata>=2025.2"]
[project.optional-dependencies]
slack = ["slack-bolt>=1.23,<2", "aiohttp>=3.12,<4"]
[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "aiosqlite>=0.21,<1",
    "ruff>=0.12,<1",
    "slack-bolt>=1.23,<2",
    "aiohttp>=3.12,<4",
    "pytest-playwright>=0.10.0",
]
[tool.pytest.ini_options]
pythonpath = ["backend", "slack_bot"]
asyncio_mode = "auto"
testpaths = ["backend/tests", "slack_bot/tests"]
asyncio_default_fixture_loop_scope = "function"
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
