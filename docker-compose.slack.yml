name: jobhunter-slack
services:
  slack-db:
    image: postgres:16
    environment:
      POSTGRES_DB: jobhunter_slack
      POSTGRES_USER: jobhunter_slack
      POSTGRES_PASSWORD: ${JOBHUNTER_SLACK_DB_PASSWORD:?Set a separate URL-safe database password}
    volumes:
      - slack-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U jobhunter_slack -d jobhunter_slack']
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [private]
  jobhunter-slack:
    build:
      context: .
      dockerfile: slack_bot/Dockerfile
    env_file: ${JOBHUNTER_SLACK_ENV_FILE:-.env.slack}
    environment:
      JOBHUNTER_SLACK_DATABASE_URL: postgresql+asyncpg://jobhunter_slack:${JOBHUNTER_SLACK_DB_PASSWORD}@slack-db:5432/jobhunter_slack
    depends_on:
      slack-db:
        condition: service_healthy
    restart: unless-stopped
    init: true
    networks: [default, private]
networks:
  private:
    internal: true
volumes:
  slack-data:
